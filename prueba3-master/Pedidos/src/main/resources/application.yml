server:
  port: 8086

spring:
  application:
    name: Pedidos
  datasource:
    url: jdbc:mysql://localhost:3306/db_anfri_pedidos
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: admin
      password: 12345

cliente-service:
  url: http://localhost:8080/api/v1/clientes

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true